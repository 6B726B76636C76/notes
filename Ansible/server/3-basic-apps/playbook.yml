---
- name: Install Docker, containerd, Kubernetes (kubeadm) + Cilium + MetalLB + cert-manager + external-dns
  hosts: servers
  become: true
  gather_facts: true

  vars:
    kubernetes_version: "1.31"
    cilium_version: "1.19.8"
    pod_cidr: "10.244.0.0/16"

    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
    docker_arch: "{{ docker_arch_map[ansible_architecture] | default(ansible_architecture) }}"

    # Only bootstrap/admin users.
    # GitLab is deployed separately.
    k8s_users:
      - vaclav
      - ansible

    kubeconfig: /etc/kubernetes/admin.conf

    # Cilium shared ingress:
    # Admins, developers and HTTP-only VPN users
    # are allowed to reach HTTP/HTTPS ingress.
    cilium_ingress_source_ranges:
      - "{{ admin_subnet }}"
      - "{{ limited_subnet }}"
      - "{{ http_only_subnet }}"

  tasks:

    # ---------- Prerequisites ----------
    - name: Ensure swapfile is in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^#*\s*/swapfile\s'
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Enable swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_status
      changed_when: false
      failed_when: false

    - name: Activate swapfile if not active
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in swap_status.stdout"
      changed_when: true

    - name: Set vm.swappiness=10
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_set: true
        state: present
        reload: true

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Set sysctl params
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    # ---------- Docker + containerd ----------
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - conntrack
          - ethtool
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker and containerd
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ k8s_users }}"

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Deploy containerd config (SystemdCgroup = true)
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        mode: "0644"
      notify: restart containerd

    - name: Ensure containerd is running
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Ensure docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # ---------- Kubernetes packages ----------
    - name: Add Kubernetes GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [trusted=yes] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Configure kubelet to ignore swap (env file)
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS="--fail-swap-on=false"
        mode: "0644"
      notify: restart kubelet

    # ---------- kubeadm init ----------
    - name: Reset existing cluster (only if reset_cluster=true)
      ansible.builtin.command: kubeadm reset -f
      when: reset_cluster | default(false) | bool

    - name: Clean up Kubernetes directories (only if reset_cluster=true)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /etc/kubernetes
      when: reset_cluster | default(false) | bool

    - name: Restart containerd after reset (clean state)
      ansible.builtin.systemd:
        name: containerd
        state: restarted
      when: reset_cluster | default(false) | bool

    - name: Wait for containerd to be fully responsive
      ansible.builtin.command: ctr version
      register: ctr_check
      retries: 30
      delay: 5
      until: ctr_check.rc == 0
      changed_when: false
      when: reset_cluster | default(false) | bool

    - name: Check if cluster already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Initialize Kubernetes control-plane
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_cidr }}
        --cri-socket=unix:///var/run/containerd/containerd.sock
        --apiserver-advertise-address={{ ansible_facts["default_ipv4"]["address"] }}
        --skip-phases=addon/kube-proxy
      when: not k8s_admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Show kubeadm init output
      ansible.builtin.debug:
        var: kubeadm_init_result.stdout_lines
      when: kubeadm_init_result is defined and kubeadm_init_result.changed | default(false)

    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ item }}/.kube"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"
      loop: "{{ k8s_users }}"

    - name: Copy admin.conf
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ item }}/.kube/config"
        remote_src: true
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0600"
      loop: "{{ k8s_users }}"

    - name: Remove control-plane taint (single-node)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig }}
        taint nodes --all node-role.kubernetes.io/control-plane-
      register: taint_result
      failed_when: taint_result.rc != 0 and 'not found' not in taint_result.stderr
      changed_when: "'untainted' in taint_result.stdout"

    # ---------- kubelet swap config ----------
    - name: Enable failSwapOn=false in kubelet config
      ansible.builtin.replace:
        path: /var/lib/kubelet/config.yaml
        regexp: '^failSwapOn:.*$'
        replace: 'failSwapOn: false'
      notify: restart kubelet

    - name: Add memorySwap.swapBehavior=LimitedSwap to kubelet config
      ansible.builtin.blockinfile:
        path: /var/lib/kubelet/config.yaml
        marker: "# {mark} ANSIBLE MANAGED SWAP"
        block: |
          memorySwap:
            swapBehavior: LimitedSwap
      notify: restart kubelet

    - name: Restart kubelet to apply swap config
      ansible.builtin.meta: flush_handlers

    # ============================================================
    # Initial control-plane readiness
    # ============================================================

    - name: Wait for Kubernetes API
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: kubectl get --raw=/readyz
      register: apiserver_ready
      retries: 30
      delay: 5
      until: apiserver_ready.rc == 0
      changed_when: false

    - name: Wait for kube-controller-manager
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait
        --for=condition=Ready
        pod
        -l component=kube-controller-manager
        -n kube-system
        --timeout=30s
      register: controller_manager_ready
      retries: 10
      delay: 5
      until: controller_manager_ready.rc == 0
      changed_when: false

    - name: Wait for kube-scheduler
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait
        --for=condition=Ready
        pod
        -l component=kube-scheduler
        -n kube-system
        --timeout=30s
      register: scheduler_ready
      retries: 10
      delay: 5
      until: scheduler_ready.rc == 0
      changed_when: false

    - name: Wait for etcd
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait
        --for=condition=Ready
        pod
        -l component=etcd
        -n kube-system
        --timeout=30s
      register: etcd_ready
      retries: 10
      delay: 5
      until: etcd_ready.rc == 0
      changed_when: false

    # ============================================================
    # Kubernetes control-plane metrics
    # ============================================================

    - name: Bind kube-controller-manager metrics to all host interfaces
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-controller-manager.yaml
        regexp: '(^\s*-\s*--bind-address=)127\.0\.0\.1$'
        replace: '\g<1>0.0.0.0'

    - name: Bind kube-scheduler metrics to all host interfaces
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-scheduler.yaml
        regexp: '(^\s*-\s*--bind-address=)127\.0\.0\.1$'
        replace: '\g<1>0.0.0.0'

    - name: Bind etcd metrics to all host interfaces
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/etcd.yaml
        regexp: '--listen-metrics-urls=http://127\.0\.0\.1:2381'
        replace: '--listen-metrics-urls=http://0.0.0.0:2381'

    # ============================================================
    # Wait for API after control-plane manifest changes
    # ============================================================

    - name: Wait for Kubernetes API after metrics configuration
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: kubectl get --raw=/readyz
      register: apiserver_ready_after_metrics
      retries: 30
      delay: 5
      until: apiserver_ready_after_metrics.rc == 0
      changed_when: false

    - name: Verify control-plane metrics listeners
      ansible.builtin.shell: |
        ss -lnt | grep -E ':(10257|10259|2381)\s'
      register: control_plane_metrics_listeners
      changed_when: false

    - name: Show control-plane metrics listeners
      ansible.builtin.debug:
        var: control_plane_metrics_listeners.stdout_lines

    # ---------- Helm ----------
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: "0700"

    - name: Install Helm
      ansible.builtin.command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm

    # ---------- Cilium ----------
    - name: Add Cilium Helm repo
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
      changed_when: false

    - name: Update Helm repos
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Install / Upgrade Cilium
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --set operator.replicas=1
        --set kubeProxyReplacement=true
        --set socketLB.hostNamespaceOnly=false
        --set ipam.mode=kubernetes
        --set ingressController.enabled=true
        --set ingressController.loadbalancerMode=shared
        --set ingressController.service.type=LoadBalancer
        --set ingressController.service.insecureNodePort=32283
        --set ingressController.service.secureNodePort=31140
        --set ingressController.service.loadBalancerIP={{ public_ip }}
        --set-string ingressController.service.externalTrafficPolicy=Cluster
        --set bpf.lbSourceRangeAllTypes=true
        --set k8sServiceHost={{ ansible_facts["default_ipv4"]["address"] }}
        --set k8sServicePort=6443
        --set prometheus.enabled=true
        --set envoy.prometheus.enabled=true
        --set operator.prometheus.enabled=true
      register: cilium_install
      changed_when: true

    - name: Wait for Cilium DaemonSet rollout
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl rollout status daemonset/cilium
        -n kube-system
        --timeout=300s
      changed_when: false

    - name: Wait for node Ready
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false

    # ============================================================
    # Restrict shared Cilium Ingress to WireGuard networks
    #
    # 172.16.0.0/27  - admins
    # 172.16.1.0/24  - developers
    # 172.16.8.0/21  - HTTP-only users
    #
    # Internet sources are excluded.
    # ============================================================

    - name: Wait for Cilium ingress Service
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl get service cilium-ingress -n kube-system
      register: cilium_ingress_service
      retries: 30
      delay: 5
      until: cilium_ingress_service.rc == 0
      changed_when: false

    - name: Restrict Cilium Ingress to WireGuard source ranges
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig }}
          - -n
          - kube-system
          - patch
          - service/cilium-ingress
          - --type=merge
          - -p
          - >-
            {"spec":{"loadBalancerSourceRanges":{{ cilium_ingress_source_ranges | to_json }}}}

    - name: Read Cilium Ingress source ranges
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig }}
          - -n
          - kube-system
          - get
          - service/cilium-ingress
          - -o
          - jsonpath={.spec.loadBalancerSourceRanges[*]}
      register: cilium_ingress_source_ranges_result
      changed_when: false

    - name: Assert Cilium Ingress is VPN-only
      ansible.builtin.assert:
        that:
          - cilium_ingress_source_ranges_result.stdout.split() | difference(cilium_ingress_source_ranges) | length == 0
          - cilium_ingress_source_ranges_result.stdout.split() | length == cilium_ingress_source_ranges | length
        fail_msg: >-
          Incorrect Cilium Ingress source ranges:
          {{ cilium_ingress_source_ranges_result.stdout }}
        success_msg: >-
          Cilium Ingress is restricted to:
          {{ cilium_ingress_source_ranges | join(', ') }}

    # ---------- MetalLB ----------
    - name: Add MetalLB Helm repo
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: helm repo add metallb https://metallb.github.io/metallb
      changed_when: false

    - name: Install / Upgrade MetalLB (L2 mode, without FRR)
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        helm upgrade --install metallb metallb/metallb
        --namespace metallb-system
        --create-namespace
        --version 0.14.9
        --reuse-values
        --set speaker.frr.enabled=false
        --set controller.frr.enabled=false
      register: metallb_install
      changed_when: "'STATUS: deployed' in metallb_install.stdout or 'STATUS: upgraded' in metallb_install.stdout"

    - name: Wait for MetalLB pods to be Ready
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pods
        -l app.kubernetes.io/name=metallb
        -n metallb-system
        --timeout=300s
      changed_when: false
      retries: 2
      delay: 15
      register: metallb_wait
      until: metallb_wait.rc == 0

    - name: Configure MetalLB IPAddressPool
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses:
          - {{ public_ip }}/32
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - default-pool
        EOF
      register: metallb_pool
      changed_when: "'configured' in metallb_pool.stdout or 'created' in metallb_pool.stdout"

    # ---------- cert-manager ----------
    - name: Add Jetstack Helm repo
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: helm repo add jetstack https://charts.jetstack.io
      changed_when: false

    - name: Install / Upgrade cert-manager
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager
        --create-namespace
        --reuse-values
        --set crds.enabled=true
      register: cert_manager_install
      changed_when: "'STATUS: deployed' in cert_manager_install.stdout or 'STATUS: upgraded' in cert_manager_install.stdout"

    - name: Wait for cert-manager
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pods
        -l app.kubernetes.io/instance=cert-manager
        -n cert-manager
        --timeout=180s
      changed_when: false

    - name: Create Cloudflare secret for cert-manager
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.shell: |
        kubectl create secret generic cloudflare-api-token \
          --namespace cert-manager \
          --from-literal=api-token='{{ cloudflare_api_token }}' \
          --dry-run=client \
          -o yaml | kubectl apply -f -
      register: cf_secret
      changed_when: "'created' in cf_secret.stdout or 'configured' in cf_secret.stdout"

    - name: Deploy ClusterIssuer (Let's Encrypt + Cloudflare DNS-01)
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-cloudflare
        spec:
          acme:
            server: https://acme-v02.api.letsencrypt.org/directory
            email: {{ letsencrypt_email }}
            privateKeySecretRef:
              name: letsencrypt-cloudflare-key
            solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: cloudflare-api-token
                    key: api-token
        EOF
      register: cluster_issuer
      changed_when: "'configured' in cluster_issuer.stdout or 'created' in cluster_issuer.stdout"

    # ---------- external-dns ----------
    - name: Create external-dns namespace
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.shell: |
        kubectl create namespace external-dns \
          --dry-run=client \
          -o yaml | kubectl apply -f -
      register: external_dns_namespace
      changed_when: "'created' in external_dns_namespace.stdout or 'configured' in external_dns_namespace.stdout"

    - name: Create Cloudflare secret for external-dns
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.shell: |
        kubectl create secret generic cloudflare-api-token \
          --namespace external-dns \
          --from-literal=api-token='{{ cloudflare_api_token }}' \
          --dry-run=client \
          -o yaml | kubectl apply -f -
      register: cf_secret_dns
      changed_when: "'created' in cf_secret_dns.stdout or 'configured' in cf_secret_dns.stdout"

    - name: Add external-dns Helm repo
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
      changed_when: false

    - name: Install / Upgrade external-dns
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ansible.builtin.command: >
        helm upgrade --install external-dns external-dns/external-dns
        --namespace external-dns
        --reuse-values
        --set provider=cloudflare
        --set policy=sync
        --set env[0].name=CF_API_TOKEN
        --set-string env[0].valueFrom.secretKeyRef.name=cloudflare-api-token
        --set-string env[0].valueFrom.secretKeyRef.key=api-token
        --set sources[0]=ingress
        --set domainFilters[0]={{ cloudflare_domain }}
      register: external_dns_install
      changed_when: "'STATUS: deployed' in external_dns_install.stdout or 'STATUS: upgraded' in external_dns_install.stdout"

  handlers:

    - name: restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

    - name: restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted