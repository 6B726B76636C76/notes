---
# ============================================================
# cAdvisor
# ============================================================

- name: Wait for cAdvisor DaemonSet rollout
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      rollout status
      daemonset/cadvisor
      -n {{ cadvisor_namespace }}
      --timeout=300s
  changed_when: false

- name: Wait for cAdvisor pod to become Ready
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      wait
      --for=condition=Ready
      pod
      -l app=cadvisor
      -n {{ cadvisor_namespace }}
      --timeout=300s
  changed_when: false

# ============================================================
# VPS node_exporter
# ============================================================

- name: Check VPS node_exporter
  ansible.builtin.uri:
    url: "http://127.0.0.1:9100/metrics"
    return_content: true
  register: vps_node_exporter_metrics
  changed_when: false

- name: Validate VPS node_exporter
  ansible.builtin.assert:
    that:
      - vps_node_exporter_metrics.status == 200
      - "'node_cpu_seconds_total' in vps_node_exporter_metrics.content"
      - "'wireguard_up' in vps_node_exporter_metrics.content"
    fail_msg: >-
      VPS node_exporter or WireGuard metrics are not available.

# ============================================================
# Prometheus
# ============================================================

- name: Wait for Prometheus pod
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      wait
      --for=condition=Ready
      pod
      -l app.kubernetes.io/name=prometheus
      -n {{ namespace_monitoring }}
      --timeout=300s
  changed_when: false

# ============================================================
# Monitoring pods
# ============================================================

- name: Get monitoring pods
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      get pods
      -n {{ namespace_monitoring }}
      -o wide
  register: monitoring_pods
  changed_when: false

- name: Show monitoring pods
  ansible.builtin.debug:
    var: monitoring_pods.stdout_lines

# ============================================================
# ServiceMonitors
# ============================================================

- name: Get ServiceMonitors
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      get servicemonitor
      -A
  register: service_monitors
  changed_when: false

- name: Show ServiceMonitors
  ansible.builtin.debug:
    var: service_monitors.stdout_lines

# ============================================================
# PodMonitors
# ============================================================

- name: Get PodMonitors
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      get podmonitor
      -A
  register: pod_monitors
  changed_when: false

- name: Show PodMonitors
  ansible.builtin.debug:
    var: pod_monitors.stdout_lines

# ============================================================
# Prometheus target-related resources
# ============================================================

- name: Get Prometheus resources
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ kubeconfig }}
      get prometheus
      -n {{ namespace_monitoring }}
  register: prometheus_resources
  changed_when: false

- name: Show Prometheus resources
  ansible.builtin.debug:
    var: prometheus_resources.stdout_lines