---
# ============================================================
# Harbor
# ============================================================

- name: Deploy Harbor
  hosts: servers
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../group_vars/secrets.yml"

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:

    - name: Configure Harbor
      ansible.builtin.include_tasks:
        file: tasks/harbor.yml