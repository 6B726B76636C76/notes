---
# ============================================================
# Grafana Alerting
# ============================================================

- name: Configure Grafana Alerting
  hosts: servers
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../group_vars/secrets.yml"

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:

    - name: Configure Grafana Alerting
      ansible.builtin.include_tasks:
        file: tasks/alerting.yml