apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://gitlab-webservice-default.vps.svc:8181/devops/gitops.git
    targetRevision: main
    path: root

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
